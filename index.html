<!DOCTYPE html>
<html lang="es" class="dark" style="color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Método TMAX - Diagnóstico Personalizado</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
        }
        
        .fade-in { animation: fadeIn 0.6s ease-in-out forwards; }
        .slide-in-up { animation: slideInUp 0.7s ease-out forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-black">

    <div id="app-container"></div>

    <script>
        // ===================================================================================
        // JAVASCRIPT "CÉREBRO" DO SITE (VERSÃO CORRIGIDA E COMPLETA)
        // ===================================================================================

        const appContainer = document.getElementById('app-container');
        
        // 1. ESTADO DA APLICAÇÃO
        let appState = {
            currentView: 'hero',
            currentStep: 0,
            answers: {},
        };

        // QUIZ COMPLETO COM 10 PERGUNTAS + 1 PERGUNTA DE TAMANHO
        const quizQuestions = [
            { id: "nome", question: "¿Cuál es tu nombre?", type: 'text', placeholder: 'Escribe tu respuesta aquí...' },
            { id: "energia", question: "¿Cómo evalúas tu nivel de energía y disposición a lo largo del día?", options: ['Muy bajo (siempre cansado, falta de iniciativa)', 'Bajo (cansancio frecuente, dificultad para concentrarse)', 'Moderado (energía razonable, algunos picos de cansancio)', 'Alto (lleno de energía, productivo todo el día)'] },
            { id: "musculos", question: "¿Has notado cambios en tu masa muscular o dificultad para ganar músculos, incluso entrenando?", options: ['Pérdida significativa de masa muscular', 'Pequeña pérdida o dificultad para ganhar', 'Mantenimiento de la masa muscular', 'Ganancia fácil de masa muscular'] },
            { id: "sono", question: "¿Cómo está la calidad de tu sueño? ¿Te despiertas descansado?", options: ['Muy mala (insomnio, sueño agitado, despiertas agotado)', 'Mala (dificultad para dormir, sueño ligero)', 'Regular (duermes, pero no siempre despiertas totalmente descansado)', 'Buena (duermes profundamente, despiertas revigorizado)'] },
            { id: "humor", question: "¿Has experimentado alteraciones del humor, como irritabilidad, ansiedad o desánimo?", options: ['Frecuentemente (irritabilidad, ansiedad, desánimo constante)', 'Ocasionalmente (algunos momentos de irritabilidad o desánimo)', 'Raramente (humor estable, pocas alteraciones)', 'Nunca (siempre de buen humor, positivo)'] },
            { id: "libido", question: "¿Con qué frecuencia sientes deseo sexual (libido)?", options: ['Casi nunca (libido muy baja o inexistente)', 'Raramente (poco deseo, solo en situaciones específicas)', 'A veces (deseo moderado, varía según el día)', 'Frecuentemente (deseo sexual alto y regular)'] },
            { id: "erecao", question: "¿Cómo evalúas la calidad de tus erecciones?", options: ['Muy insatisfactoria (dificultad para tener o mantener erecciones)', 'Insatisfactoria (erecciones débiles o inconsistentes)', 'Satisfactoria (erecciones razonables, pero podrían ser mejores)', 'Excelente (erecciones fuertes, duraderas y espontáneas)'] },
            { id: "orgasmo", question: "¿Has tenido orgasmos satisfactorios e intensos?", options: ['No (orgasmos débiles o ausentes)', 'Raramente (orgasmos poco intensos)', 'A veces (orgasmos satisfactorios, pero no siempre intensos)', 'Siempre (orgasmos muy intensos y placenteros)'] },
            { id: "tamanho_atual", question: "¿Cuál es el tamaño actual de tu pene erecto (en centímetros)?", options: ['Menos de 12 cm', 'Entre 12 y 14 cm', 'Entre 14 y 16 cm', 'Más de 16 cm'] },
            { id: "aumento_desejado", question: "¿Cuántos centímetros te gustaría aumentar en el tamaño de tu pene?", options: ['1 cm', '2 cm', '3 cm', 'Más de 3 cm'] },
        ];
        const totalQuizSteps = quizQuestions.length + 1; // 10 perguntas + 1 de tamanho

        // 2. ÍCONES SVG
        const IconArrowRight = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 ml-2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`;
        const IconArrowLeft = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>`;
        const IconCheck = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-green-500 mr-3 flex-shrink-0"><path d="M20 6 9 17l-5-5"/></svg>`;

        // 3. FUNÇÕES DE RENDERIZAÇÃO DE HTML
        function getFooterHTML() {
            const currentYear = new Date().getFullYear();
            return `
            <footer class="bg-black py-8 px-4 mt-16 border-t border-gray-900">
                <div class="max-w-6xl mx-auto text-center text-gray-500">
                    <p class="text-sm">© ${currentYear} Método Tmax. Todos los derechos reservados.</p>
                    <p class="text-xs mt-4 max-w-md mx-auto">
                        Este sitio no está afiliado a ninguna empresa farmacéutica o médica. Los resultados pueden variar de persona a persona.
                    </p>
                </div>
            </footer>
            `;
        }

        function getHeroHTML() {
            return `
            <div class="fade-in">
                <section class="min-h-screen flex items-center justify-center bg-black overflow-hidden py-20 px-4">
                    <div class="container mx-auto z-10 relative max-w-4xl text-center">
                        <div class="slide-in-up">
                            <h1 class="text-5xl sm:text-6xl md:text-7xl lg:text-8xl font-black tracking-tighter">
                                <span class="text-white">MÉTODO</span> <span class="text-[#ED1C24]">TMAX</span>
                            </h1>
                        </div>
                        <div class="slide-in-up" style="animation-delay: 0.2s;">
                            <p class="text-xl sm:text-2xl md:text-3xl text-gray-200 font-light my-8 max-w-3xl mx-auto">
                                Siente el poder de hasta un 400% más de testosterona en solo 21 días. De forma 100% natural, revive tu energía, vigor y virilidad como nunca antes.
                            </p>
                        </div>
                        <div class="max-w-3xl mx-auto text-base sm:text-lg md:text-xl space-y-6 mb-10">
                            <p class="text-white/80 slide-in-up" style="animation-delay: 0.4s;">
                                Te mintieron: la testosterona baja no es por la edad. Proviene de toxinas, del estrés y de hábitos que bloquean tu producción natural impidiendo así que tu lápiz crezca y que tú te sientas hombre. Pero la verdad es que tu cuerpo todavía puede producir testosterona como si si fueras un toro.
                            </p>
                            <p class="text-white font-medium slide-in-up" style="animation-delay: 0.6s;">
                                El Método Tmax reactiva tu producción hormonal natural, aumentando energía, libido, masa muscular y confianza haciendo que tu lápiz crezca también — sin inyecciones, geles o efectos secundarios.
                            </p>
                        </div>
                        <div class="slide-in-up" style="animation-delay: 0.8s;">
                            <button onclick="startQuiz()" class="bg-[#ED1C24] hover:bg-[#ED1C24]/90 text-white font-bold text-lg py-4 px-10 rounded-lg transition-transform duration-300 hover:scale-105 flex items-center mx-auto shadow-lg shadow-red-500/20">
                                EVALUAR MI TESTOSTERONA ${IconArrowRight}
                            </button>
                            <p class="text-gray-500 text-sm mt-3">Test personalizado en 2 minutos</p>
                        </div>
                        <div class="mt-12 grid grid-cols-3 gap-8 max-w-lg mx-auto slide-in-up" style="animation-delay: 1s;">
                            <div class="text-center"><div class="text-2xl sm:text-3xl font-bold text-[#ED1C24]">+400%</div><div class="text-gray-400 text-xs sm:text-sm">Aumento Testosterona</div></div>
                            <div class="text-center"><div class="text-2xl sm:text-3xl font-bold text-[#ED1C24]">10 min</div><div class="text-gray-400 text-xs sm:text-sm">Por día</div></div>
                            <div class="text-center"><div class="text-2xl sm:text-3xl font-bold text-[#ED1C24]">21 días</div><div class="text-gray-400 text-xs sm:text-sm">Resultados visibles</div></div>
                        </div>
                    </div>
                </section>
                ${getFooterHTML()}
            </div>
            `;
        }
        
        function getQuizHTML() {
            const progress = ((appState.currentStep + 1) / totalQuizSteps) * 100;
            let currentQuestionHTML = '';
            const isFinalQuestion = appState.currentStep === totalQuizSteps - 1;

            if (!isFinalQuestion) {
                const q = quizQuestions[appState.currentStep];
                const userName = appState.answers.nome || '';
                let questionText = q.question;
                if (appState.currentStep > 0 && userName) {
                    questionText = `${userName}, ${q.question.charAt(0).toLowerCase() + q.question.slice(1)}`;
                }
                
                if (q.type === 'text') {
                    currentQuestionHTML = `
                        <h2 class="text-xl md:text-2xl font-bold text-white mb-6 text-center leading-tight">${questionText}</h2>
                        <input type="text" id="text-input" value="${appState.answers[q.id] || ''}" oninput="handleTextChange('${q.id}', this.value)" placeholder="${q.placeholder}" class="w-full p-4 text-center text-lg bg-gray-800 border-2 border-gray-700 rounded-xl text-white placeholder-gray-400 focus:border-red-500 focus:outline-none transition-colors">
                    `;
                } else {
                    const optionsHTML = q.options.map(opt => `
                        <button onclick="handleAnswer('${q.id}', '${opt}')" class="w-full p-4 text-left rounded-xl border-2 transition-all duration-200 ${appState.answers[q.id] === opt ? 'border-red-500 bg-red-500/10 text-white' : 'border-gray-700 bg-gray-800 text-gray-300 hover:border-red-500/50'}">
                            ${opt}
                        </button>
                    `).join('');
                    currentQuestionHTML = `<h2 class="text-xl md:text-2xl font-bold text-white mb-6 text-center leading-tight">${questionText}</h2><div class="space-y-3 mb-6">${optionsHTML}</div>`;
                }
            } else {
                currentQuestionHTML = `
                    <h2 class="text-xl md:text-2xl font-bold text-white mb-6 text-center leading-tight">¿Cuál es el tamaño actual de tu lápiz en erección (en cm)?</h2>
                    <input type="number" id="height-input" value="${appState.answers.height || ''}" oninput="handleHeightChange(this.value)" placeholder="Ingresa el tamaño en cm" class="w-full p-4 text-center text-2xl font-bold bg-gray-800 border-2 border-gray-700 rounded-xl text-white placeholder-gray-400 focus:border-red-500 focus:outline-none transition-colors">
                `;
            }

            return `
            <div class="min-h-screen flex flex-col items-center justify-center py-12 px-4 fade-in">
                <div class="w-full max-w-2xl mx-auto mb-8">
                    <div class="text-center mb-6"><h1 class="text-2xl md:text-3xl font-bold text-white mb-2">Diagnóstico <span class="text-red-500">Personalizado</span></h1><p class="text-gray-400">Pregunta ${appState.currentStep + 1} de ${totalQuizSteps}</p></div>
                    <div class="w-full bg-gray-800 rounded-full h-2 mb-4"><div class="bg-gradient-to-r from-red-600 to-red-500 h-2 rounded-full" style="width: ${progress}%; transition: width 0.5s ease-out;"></div></div>
                    <div class="text-center"><span class="text-sm text-gray-400">${Math.round(progress)}% completado</span></div>
                </div>
                <div class="w-full max-w-2xl mx-auto bg-gray-900 rounded-2xl p-6 border border-gray-800 shadow-xl">
                    ${currentQuestionHTML}
                    <div class="flex justify-between items-center mt-8">
                        ${appState.currentStep > 0 ? `<button onclick="handleBack()" class="flex items-center px-4 py-2 text-gray-400 hover:text-white transition-colors">${IconArrowLeft} Anterior</button>` : '<div></div>'}
                        ${appState.currentStep < quizQuestions.length ? `<button onclick="handleNext()" ${!appState.answers[quizQuestions[appState.currentStep].id] ? 'disabled' : ''} class="flex items-center px-6 py-3 rounded-lg font-medium transition-all ${appState.answers[quizQuestions[appState.currentStep].id] ? 'bg-red-600 hover:bg-red-700 text-white' : 'bg-gray-700 text-gray-400 cursor-not-allowed'}">Siguiente ${IconArrowRight}</button>` : ''}
                        ${isFinalQuestion ? `<button onclick="handleNext()" ${!appState.answers.height ? 'disabled' : ''} class="flex items-center px-6 py-3 rounded-lg font-medium transition-all ${appState.answers.height ? 'bg-red-600 hover:bg-red-700 text-white' : 'bg-gray-700 text-gray-400 cursor-not-allowed'}">Analizar Resultados ${IconArrowRight}</button>` : ''}
                    </div>
                </div>
            </div>`;
        }

        function getLoadingHTML() {
            setTimeout(startLoadingProgress, 100); 
            return `<div class="min-h-screen bg-black flex items-center justify-center p-4 fade-in"><div class="w-full max-w-2xl"><div class="text-center mb-8"><h1 class="text-2xl md:text-3xl font-bold text-white mb-2">Analizando Tu Potencial de <span class="text-red-500">Testosterona</span></h1><p class="text-gray-300">Estamos creando tu protocolo de maximización...</p></div><div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl"><div class="flex justify-between items-center mb-2"><span class="text-sm font-medium text-gray-300">Progreso del Análisis</span><span id="progress-percent" class="text-sm font-medium text-red-500">0%</span></div><div class="w-full bg-gray-700 rounded-full h-3 mb-6"><div id="progress-bar" class="bg-gradient-to-r from-red-600 to-red-500 h-3
