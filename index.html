<!DOCTYPE html>
<html lang="es" class="dark" style="color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Método TMAX - Diagnóstico Personalizado</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
        }
        
        /* Animações simples para substituir a biblioteca de animação */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out forwards;
        }
        .fade-in-delay {
            animation: fadeIn 0.5s ease-in-out 0.3s forwards;
        }
        .slide-in-up {
             animation: slideInUp 0.5s ease-out forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-black">

    <div id="app-container"></div>

    <script>
        // ===================================================================================
        // JAVASCRIPT "CÉREBRO" DO SITE
        // Converte toda a lógica dos arquivos .tsx para Javascript puro
        // ===================================================================================

        // -----------------------------------------------------------------------------------
        // 1. ESTADO DA APLICAÇÃO (Variáveis que controlam o que aparece na tela)
        // -----------------------------------------------------------------------------------
        const appContainer = document.getElementById('app-container');
        
        let appState = {
            currentView: 'hero', // 'hero', 'quiz', 'loading', 'result', 'planos'
            currentStep: 0,
            answers: {},
        };

        const quizQuestions = [
          {
            id: "energia",
            question: "¿Cómo evalúas tu nivel de energía y disposición a lo largo del día?",
            options: [
              { value: "muy-bajo", label: "Muy bajo (siempre cansado, falta de iniciativa)" },
              { value: "bajo", label: "Bajo (cansancio frecuente, dificultad para concentrarse)" },
              { value: "moderado", label: "Moderado (energía razonable, algunos picos de cansancio)" },
              { value: "alto", label: "Alto (lleno de energía, productivo todo o día)" },
            ],
          },
          {
            id: "musculos",
            question: "¿Has notado cambios en tu masa muscular o dificultad para ganar músculos?",
            options: [
              { value: "perdida-significativa", label: "Pérdida significativa de masa muscular" },
              { value: "dificultad-ganar", label: "Pequeña pérdida o dificultad para ganhar" },
              { value: "mantenimiento", label: "Mantenimiento de la masa muscular" },
              { value: "ganancia-facil", label: "Ganancia fácil de masa muscular" },
            ],
          },
            {
            id: "libido",
            question: "¿Con qué frecuencia sientes deseo sexual (libido)?",
            options: [
              { value: "casi-nunca", label: "Casi nunca (libido muy baja o inexistente)" },
              { value: "raramente", label: "Raramente (poco deseo, solo en situaciones específicas)" },
              { value: "a-veces", label: "A veces (deseo moderado, varía según el día)" },
              { value: "frecuentemente", label: "Frecuentemente (deseo sexual alto y regular)" },
            ],
          },
        ];
        const totalQuizSteps = quizQuestions.length + 1;

        // -----------------------------------------------------------------------------------
        // 2. ÍCONES SVG (Substituindo os componentes de ícones)
        // -----------------------------------------------------------------------------------
        const IconArrowRight = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 ml-2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`;
        const IconArrowLeft = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>`;
        const IconCheck = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-green-500 mr-3 flex-shrink-0"><path d="M20 6 9 17l-5-5"/></svg>`;


        // -----------------------------------------------------------------------------------
        // 3. FUNÇÕES DE RENDERIZAÇÃO (Criam o HTML para cada tela)
        // -----------------------------------------------------------------------------------

        // Tela Inicial (Hero)
        function getHeroHTML() {
            return `
            <section class="min-h-screen flex items-center justify-center bg-black overflow-hidden py-12 px-4 fade-in">
              <div class="container mx-auto z-10 relative max-w-4xl text-center">
                <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight text-white mb-4 slide-in-up">
                  MÉTODO <span class="text-red-600">TMAX</span>
                </h1>
                <p class="text-lg md:text-xl text-gray-300 max-w-2xl mx-auto mb-8 slide-in-up" style="animation-delay: 0.2s;">
                  Sinta o poder de até um 400% mais de testosterona em solo 21 días. De forma 100% natural, revive tu energía, vigor y virilidad.
                </p>
                <div class="slide-in-up" style="animation-delay: 0.4s;">
                  <button
                    onclick="startQuiz()"
                    class="bg-red-600 text-white font-bold text-lg py-3 px-8 rounded-lg hover:bg-red-700 transition-colors duration-300 flex items-center mx-auto"
                  >
                    EVALUAR MI TESTOSTERONA
                    ${IconArrowRight}
                  </button>
                  <p class="text-gray-500 text-sm mt-2">Test personalizado en 2 minutos</p>
                </div>
              </div>
            </section>
            `;
        }

        // Tela do Quiz (combina cabeçalho e perguntas)
        function getQuizHTML() {
            const progress = ((appState.currentStep + 1) / totalQuizSteps) * 100;
            let currentQuestionHTML = '';

            // Decide se mostra a pergunta de múltipla escolha ou a de tamanho
            if (appState.currentStep < quizQuestions.length) {
                const q = quizQuestions[appState.currentStep];
                const optionsHTML = q.options.map(opt => `
                    <button
                        onclick="handleAnswer('${q.id}', '${opt.value}')"
                        class="w-full p-4 text-left rounded-xl border-2 transition-all duration-200 
                               ${appState.answers[q.id] === opt.value ? 'border-red-500 bg-red-500/10 text-white' : 'border-gray-700 bg-gray-800 text-gray-300 hover:border-red-500/50'}"
                    >
                        ${opt.label}
                    </button>
                `).join('');
                
                currentQuestionHTML = `
                    <h2 class="text-xl md:text-2xl font-bold text-white mb-6 text-center leading-tight">${q.question}</h2>
                    <div class="space-y-3 mb-6">${optionsHTML}</div>
                `;
            } else {
                currentQuestionHTML = `
                    <h2 class="text-xl md:text-2xl font-bold text-white mb-6 text-center leading-tight">
                        ¿Cuál es el tamaño actual de tu lápiz en erección (en cm)?
                    </h2>
                    <div class="mb-6">
                        <input
                            type="number"
                            id="height-input"
                            value="${appState.answers.height || ''}"
                            oninput="handleHeightChange(this.value)"
                            placeholder="Ingresa el tamaño en cm"
                            class="w-full p-4 text-center text-2xl font-bold bg-gray-800 border-2 border-gray-700 rounded-xl text-white placeholder-gray-400 focus:border-red-500 focus:outline-none transition-colors"
                        />
                    </div>
                `;
            }

            return `
            <div class="min-h-screen flex flex-col items-center justify-center py-12 px-4 fade-in">
                <div class="w-full max-w-2xl mx-auto mb-8">
                    <div class="text-center mb-6">
                        <h1 class="text-2xl md:text-3xl font-bold text-white mb-2">
                            Diagnóstico <span class="text-red-500">Personalizado</span>
                        </h1>
                        <p class="text-gray-400">Pregunta ${appState.currentStep + 1} de ${totalQuizSteps}</p>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-2 mb-4">
                        <div class="bg-gradient-to-r from-red-600 to-red-500 h-2 rounded-full" style="width: ${progress}%; transition: width 0.5s ease-out;"></div>
                    </div>
                    <div class="text-center"><span class="text-sm text-gray-400">${Math.round(progress)}% completado</span></div>
                </div>

                <div class="w-full max-w-2xl mx-auto bg-gray-900 rounded-2xl p-6 border border-gray-800 shadow-xl">
                    ${currentQuestionHTML}
                    <div class="flex justify-between items-center mt-8">
                        ${appState.currentStep > 0 ? `<button onclick="handleBack()" class="flex items-center px-4 py-2 text-gray-400 hover:text-white transition-colors">${IconArrowLeft} Anterior</button>` : '<div></div>'}
                        ${appState.currentStep === totalQuizSteps - 1 ? `<button onclick="handleNext()" ${!appState.answers.height ? 'disabled' : ''} class="flex items-center px-6 py-3 rounded-lg font-medium transition-all ${appState.answers.height ? 'bg-red-600 hover:bg-red-700 text-white' : 'bg-gray-700 text-gray-400 cursor-not-allowed'}">Analizar Resultados ${IconArrowRight}</button>` : ''}
                    </div>
                </div>
            </div>
            `;
        }

        // Tela de Carregamento
        function getLoadingHTML() {
            // Inicia a lógica de progresso quando esta tela for renderizada
            setTimeout(startLoadingProgress, 100); 
            return `
            <div class="min-h-screen bg-black flex items-center justify-center p-4 fade-in">
              <div class="w-full max-w-2xl">
                <div class="text-center mb-8">
                  <h1 class="text-2xl md:text-3xl font-bold text-white mb-2">
                    Analizando Tu Potencial de <span class="text-red-500">Testosterona</span>
                  </h1>
                  <p class="text-gray-300">Estamos creando tu protocolo de maximización...</p>
                </div>
                <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl">
                  <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-medium text-gray-300">Progreso del Análisis</span>
                    <span id="progress-percent" class="text-sm font-medium text-red-500">0%</span>
                  </div>
                  <div class="w-full bg-gray-700 rounded-full h-3 mb-6">
                    <div id="progress-bar" class="bg-gradient-to-r from-red-600 to-red-500 h-3 rounded-full" style="width: 0%; transition: width 0.1s linear;"></div>
                  </div>
                  <div id="progress-step-text" class="text-center text-white font-medium">Analizando tu perfil hormonal...</div>
                </div>
              </div>
            </div>`;
        }
        
        // Tela de Resultado
        function getResultHTML() {
            return `
            <div class="min-h-screen bg-black flex items-center justify-center p-4 fade-in">
              <div class="w-full max-w-2xl text-center">
                <div class="mb-6">
                  <h1 class="text-3xl md:text-4xl font-bold text-white mb-2">
                    Tu Resultado <span class="text-red-500">Personalizado</span>
                  </h1>
                  <p class="text-gray-300">Basado en tu análisis, este es tu potencial de optimización hormonal.</p>
                </div>
                <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl mb-6">
                  <div class="mb-6">
                    <p class="text-gray-400">Puedes aumentar hasta un</p>
                    <p class="text-5xl font-bold text-red-500 my-2">400%</p>
                    <p class="text-xl text-white">tu testosterona en 30 días</p>
                  </div>
                  <button
                    onclick="goToPlanos()"
                    class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 text-white font-bold py-4 px-8 rounded-xl text-lg transition-all duration-200 shadow-lg"
                  >
                    COMENZAR MI PROTOCOLO PERSONALIZADO
                  </button>
                </div>
              </div>
            </div>`;
        }

        // Tela de Planos (Oferta Final)
        function getPlanosHTML() {
            const checkoutUrl = "https://pay.hotmart.com/L101274511Q?checkoutMode=10";
            const features = [
                "Protocolo completo Método Tmax de 21 días", "Rutina de ejercicios específicos para testosterona", "Plan nutricional para optimización hormonal",
                "Guía de suplementación natural", "Técnicas de manejo del estrés y cortisol", "Protocolo de sueño para máxima recuperación",
                "Acceso a la comunidad privada", "Soporte 24/7 por WhatsApp", "Garantía de resultados en 30 días",
            ];
            const featuresHTML = features.map(f => `
                <div class="flex items-center">${IconCheck} <span class="text-gray-300">${f}</span></div>
            `).join('');

            return `
            <div class="min-h-screen bg-black py-12 px-4 fade-in">
              <div class="max-w-2xl mx-auto">
                <div class="text-center mb-8">
                  <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">Acceso Completo al <span class="text-red-500">Método Tmax</span></h1>
                  <p class="text-lg text-gray-300">Aumenta tu testosterona naturalmente con nuestro protocolo comprobado.</p>
                </div>
                <div class="bg-gray-900 rounded-2xl p-8 border border-gray-800">
                  <div class="space-y-4 mb-8">${featuresHTML}</div>
                  <a href="${checkoutUrl}" target="_blank" rel="noopener noreferrer"
                    class="block w-full text-center bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 text-white font-bold py-4 px-8 rounded-xl text-xl transition-all duration-200 shadow-lg">
                    AUMENTAR MI TESTOSTERONA AHORA
                  </a>
                  <p class="text-center text-gray-500 text-sm mt-4">Pago seguro procesado por Hotmart</p>
                </div>
              </div>
            </div>`;
        }


        // -----------------------------------------------------------------------------------
        // 4. LÓGICA DE CONTROLE (Funções que mudam o estado e atualizam a tela)
        // -----------------------------------------------------------------------------------

        // Função principal que desenha a tela correta
        function render() {
            window.scrollTo(0, 0); // Rola para o topo a cada mudança de tela
            switch (appState.currentView) {
                case 'hero':
                    appContainer.innerHTML = getHeroHTML();
                    break;
                case 'quiz':
                    appContainer.innerHTML = getQuizHTML();
                    break;
                case 'loading':
                    appContainer.innerHTML = getLoadingHTML();
                    break;
                case 'result':
                    appContainer.innerHTML = getResultHTML();
                    break;
                case 'planos':
                    appContainer.innerHTML = getPlanosHTML();
                    break;
            }
        }
        
        // Funções de evento chamadas pelos botões no HTML
        function startQuiz() {
            appState.currentView = 'quiz';
            render();
        }
        
        function handleNext() {
            if (appState.currentStep < totalQuizSteps - 1) {
                appState.currentStep++;
                render();
            } else {
                appState.currentView = 'loading';
                render();
            }
        }

        function handleBack() {
            if (appState.currentStep > 0) {
                appState.currentStep--;
                render();
            }
        }
        
        function handleAnswer(questionId, value) {
            appState.answers[questionId] = value;
            // Avança automaticamente após um pequeno delay
            setTimeout(handleNext, 300);
        }

        function handleHeightChange(value) {
            const numValue = parseInt(value, 10);
            if (!isNaN(numValue) && numValue > 0 && numValue < 50) {
                appState.answers.height = numValue;
            } else {
                appState.answers.height = null;
            }
            // Re-renderiza para habilitar/desabilitar o botão
            render();
        }
        
        function goToPlanos() {
            appState.currentView = 'planos';
            render();
        }

        function startLoadingProgress() {
            let progress = 0;
            const steps = [ "Analizando tu perfil hormonal...", "Calculando tu potencial de aumento...", "Generando tu plan personalizado...", "Finalizando tu diagnóstico..." ];
            let currentStepIndex = 0;

            const progressBar = document.getElementById('progress-bar');
            const progressPercent = document.getElementById('progress-percent');
            const progressStepText = document.getElementById('progress-step-text');
            
            const progressInterval = setInterval(() => {
                progress++;
                if (progressBar) progressBar.style.width = `${progress}%`;
                if (progressPercent) progressPercent.innerText = `${progress}%`;
                if (progress >= 100) {
                    clearInterval(progressInterval);
                    appState.currentView = 'result';
                    render();
                }
            }, 80); // 8 segundos de duração total

            const stepInterval = setInterval(() => {
                currentStepIndex++;
                if (progressStepText && currentStepIndex < steps.length) {
                    progressStepText.innerText = steps[currentStepIndex];
                } else {
                    clearInterval(stepInterval);
                }
            }, 2000); // Muda o texto a cada 2 segundos
        }

        // -----------------------------------------------------------------------------------
        // 5. INICIALIZAÇÃO (Mostra a primeira tela quando a página carrega)
        // -----------------------------------------------------------------------------------
        document.addEventListener('DOMContentLoaded', render);

    </script>
</body>
</html>
