        function nextStep() {
            if (currentStep < quizData.length) {
                const questionData = quizData[currentStep];
                let answer;
                if (questionData.type === 'text') {
                    answer = document.getElementById('text-answer').value.trim();
                    if (!answer) {
                        // Poderia adicionar uma mensagem de erro aqui
                        return;
                    }
                } else {
                    const radio = document.querySelector('input[name="answer"]:checked');
                    if (!radio) {
                        // Validação para garantir que uma opção foi selecionada
                        return;
                    }
                    answer = radio.value;
                }
                userAnswers[currentStep] = answer;
            }
            currentStep++;
            renderStep();
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        }

        function submitQuiz() {
            const selectedOffer = document.querySelector('input[name="oferta"]:checked');
            if (!selectedOffer) {
                alert('Por favor, seleccione una oferta para continuar.');
                return;
            }
            // Ação de finalização (aqui poderia redirecionar ou enviar os dados)
            alert('¡Gracias por completar el diagnóstico! Serás redirigido en breve.');
        }

        function startCountdown(duration, display) {
            let timer = duration, hours, minutes, seconds;
            setInterval(function () {
                hours = parseInt(timer / 3600, 10);
                minutes = parseInt((timer % 3600) / 60, 10);
                seconds = parseInt(timer % 60, 10);

                hours = hours < 10 ? "0" + hours : hours;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = hours + ":" + minutes + ":" + seconds;

                if (--timer < 0) {
                    timer = 0;
                }
            }, 1000);
        }

                const oneHourFiftyFiveMinutes = (1 * 60 * 60) + (55 * 60) + 56;
                startCountdown(oneHourFiftyFiveMinutes, countdownDisplay);
            }
