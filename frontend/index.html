<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário Anual de Tarefas - Visão Total</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        h1 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 20px;
        }
        .calendar-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .calendar-header button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .calendar-header button:hover {
            background-color: #0056b3;
        }
        .year-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .month-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        .month-header {
            text-align: center;
            padding: 10px;
            font-size: 1.2em;
            font-weight: bold;
            background-color: #f0f0f0;
            color: #444;
        }
        .week-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            background-color: #e9e9e9;
            padding: 5px 0;
            font-size: 0.8em;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: #e0e0e0;
            padding: 1px;
        }
        .day {
            background-color: #fff;
            padding: 8px 5px;
            min-height: 40px;
            text-align: right;
            position: relative;
            cursor: pointer;
        }
        .day:hover {
            background-color: #f0f8ff;
        }
        .day.has-tasks {
            border: 2px solid #28a745;
        }
        .day.completed::after {
            content: '✓';
            position: absolute;
            top: 5px;
            left: 5px;
            font-size: 1.2em;
            color: #28a745;
        }
        .day.selected-week {
            background-color: #d1ecf1;
            box-shadow: inset 0 0 5px #007bff;
        }
        .day.selected-day {
            background-color: #007bff;
            color: white;
            border: 2px solid #0056b3;
            font-weight: bold;
        }
        .day.empty {
            background-color: #f9f9f9;
            cursor: default;
        }
        #weekly-tasks-section {
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: none;
        }
        #weekly-tasks-section h2 {
            margin-top: 0;
            color: #0056b3;
            text-align: center;
        }
        .weekly-tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        .weekly-day-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            background-color: #fafafa;
            position: relative;
        }
        .weekly-day-card h3 {
            margin-top: 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            font-size: 1em;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .weekly-day-card .complete-btn {
            font-size: 0.8em;
            padding: 5px 8px;
            border-radius: 5px;
            border: none;
            color: white;
            cursor: pointer;
            background-color: #28a745;
        }
        .weekly-day-card.completed .complete-btn {
            background-color: #dc3545;
        }
        .weekly-day-card.completed h3::after {
            content: '✓';
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 1.5em;
            color: #28a745;
        }
        .daily-actions {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 10px;
        }
        .daily-actions button {
            font-size: 0.8em;
            padding: 5px 8px;
            border-radius: 5px;
            border: none;
            color: white;
            cursor: pointer;
        }
        .daily-actions .copy-btn {
            background-color: #28a745;
        }
        .daily-actions .paste-btn {
            background-color: #17a2b8;
        }
        .task-input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 10px;
        }
        .task-input-group input, .task-input-group textarea, .task-input-group select {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
            width: 100%;
            box-sizing: border-box;
        }
        .task-input-group button {
            background-color: #17a2b8;
            color: white;
            border: none;
            padding: 5px;
            border-radius: 3px;
            cursor: pointer;
        }
        .task-list {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }
        .task-item {
            display: flex;
            flex-direction: column;
            border-left: 3px solid;
            padding: 5px;
            margin-bottom: 5px;
            font-size: 0.9em;
            position: relative;
        }
        .task-item.dragging {
            opacity: 0.5;
        }
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .drag-handle {
            font-size: 1.2em;
            cursor: grab;
            color: #666;
            margin-right: 5px;
        }
        .item-actions {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .item-actions button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 2px 5px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
        }
        .item-actions .edit-btn {
            background-color: #ffc107;
            color: black;
        }
        .item-actions .split-btn {
            background-color: #32CD32;
            color: white;
        }
        .task-details {
            margin-top: 5px;
        }
        .task-details h4 {
            margin: 0;
            font-size: 1em;
        }
        .task-details p {
            margin: 0;
        }
        .edit-mode .task-details {
            display: none;
        }
        .edit-mode .edit-form {
            display: block;
        }
        .edit-form {
            display: none;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="annual-view">
            <div class="calendar-header">
                <button onclick="changeYear(-1)">&lt; Ano Anterior</button>
                <h2 id="current-year"></h2>
                <button onclick="changeYear(1)">Próximo Ano &gt;</button>
            </div>
            <div class="year-grid" id="year-grid">
                </div>
        </div>

        <div id="weekly-tasks-section">
            <div class="calendar-header" style="justify-content: space-between;">
                <button onclick="showAnnualView()">Voltar</button>
                <h2 id="weekly-tasks-header"></h2>
            </div>
            <div class="weekly-tasks-grid" id="weekly-tasks-grid">
                </div>
        </div>
    </div>

    <script>
        // Configuração da API
        const API_URL = '/api/tasks';
        
        const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        const weekdayNames = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
        const colorOptions = [
            '#FF6347', '#FFD700', '#ADFF2F', '#32CD32', '#00CED1', '#1E90FF',
            '#9370DB', '#FF69B4', '#FF8C00', '#A52A2A', '#696969', '#000000'
        ];
        
        const annualView = document.getElementById('annual-view');
        const yearGrid = document.getElementById('year-grid');
        const weeklyTasksSection = document.getElementById('weekly-tasks-section');
        const weeklyTasksHeader = document.getElementById('weekly-tasks-header');
        const weeklyTasksGrid = document.getElementById('weekly-tasks-grid');

        let currentYear;
        let tasks = {}; // Inicializa como objeto vazio
        let clipboard = null;
        let draggedItem = null;

        // Função para salvar tarefas no servidor
        async function saveTasksToServer() {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(tasks),
                });
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }
                
                const result = await response.json();
                console.log('Tarefas salvas:', result.message);
            } catch (error) {
                console.error('Erro ao salvar tarefas no servidor:', error);
                showMessage('Não foi possível salvar as tarefas. Verifique se o servidor está rodando.', 'error');
            }
        }

        // Função para carregar tarefas do servidor
        async function loadTasksFromServer() {
            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }
                
                tasks = await response.json();
                console.log('Tarefas carregadas do servidor:', tasks);
            } catch (error) {
                console.error('Erro ao carregar tarefas do servidor:', error);
                showMessage('Não foi possível carregar as tarefas. O servidor está rodando?', 'error');
                tasks = {}; // Inicia com um objeto vazio em caso de erro
            }
        }

        // Função para mostrar mensagens ao usuário
        function showMessage(message, type = 'info') {
            const messageDiv = document.createElement('div');
            messageDiv.className = type;
            messageDiv.textContent = message;
            
            const container = document.querySelector('.container');
            container.insertBefore(messageDiv, container.firstChild);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        function populateColorSelect(selectElement) {
            selectElement.innerHTML = '';
            colorOptions.forEach(color => {
                const option = document.createElement('option');
                option.value = color;
                option.textContent = color;
                option.style.backgroundColor = color;
                option.style.color = getContrastColor(color);
                selectElement.appendChild(option);
            });
            selectElement.value = '#1E90FF';
        }

        function getContrastColor(hexColor) {
            const r = parseInt(hexColor.slice(1, 3), 16);
            const g = parseInt(hexColor.slice(3, 5), 16);
            const b = parseInt(hexColor.slice(5, 7), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness > 128 ? '#000000' : '#FFFFFF';
        }

        function formatDateShort(dateString) {
            const date = new Date(dateString + 'T12:00:00');
            return `${date.getDate()}/${date.getMonth() + 1}`;
        }

        function isDayCompleted(date) {
            return tasks[date] && tasks[date].isCompleted;
        }

        function renderYearGrid(year) {
            currentYear = year;
            document.getElementById('current-year').textContent = year;
            yearGrid.innerHTML = '';
            for (let i = 0; i < 12; i++) {
                const monthCard = document.createElement('div');
                monthCard.className = 'month-card';
                monthCard.innerHTML = `<h3 class="month-header">${monthNames[i]}</h3>`;
                
                const weekdaysDiv = document.createElement('div');
                weekdaysDiv.className = 'week-grid';
                weekdaysDiv.innerHTML = weekdayNames.map(day => `<span>${day}</span>`).join('');
                monthCard.appendChild(weekdaysDiv);

                const daysDiv = document.createElement('div');
                daysDiv.className = 'days-grid';
                
                const firstDay = new Date(year, i, 1, 12, 0, 0).getDay();
                const lastDay = new Date(year, i + 1, 0, 12, 0, 0).getDate();

                for (let j = 0; j < firstDay; j++) {
                    const emptyDay = document.createElement('div');
                    emptyDay.className = 'day empty';
                    daysDiv.appendChild(emptyDay);
                }

                for (let day = 1; day <= lastDay; day++) {
                    const dayDiv = document.createElement('div');
                    dayDiv.className = 'day';
                    dayDiv.textContent = day;
                    
                    const dateString = `${year}-${String(i + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    if (tasks[dateString] && tasks[dateString].tasks && tasks[dateString].tasks.length > 0) {
                        dayDiv.classList.add('has-tasks');
                    }
                    if (isDayCompleted(dateString)) {
                        dayDiv.classList.add('completed');
                    }
                    
                    dayDiv.dataset.date = dateString;
                    dayDiv.onclick = () => showWeeklyView(dayDiv);
                    
                    daysDiv.appendChild(dayDiv);
                }

                monthCard.appendChild(daysDiv);
                yearGrid.appendChild(monthCard);
            }
        }

        function showWeeklyView(clickedDay) {
            annualView.style.display = 'none';
            weeklyTasksSection.style.display = 'block';

            document.querySelectorAll('.day.selected-week').forEach(d => d.classList.remove('selected-week'));
            document.querySelectorAll('.day.selected-day').forEach(d => d.classList.remove('selected-day'));

            const date = new Date(clickedDay.dataset.date + 'T12:00:00');
            const dayOfWeek = date.getDay();
            const startOfWeek = new Date(date);
            startOfWeek.setDate(date.getDate() - dayOfWeek);
            
            const weekDates = [];
            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(startOfWeek);
                dayDate.setDate(startOfWeek.getDate() + i);
                const dateString = `${dayDate.getFullYear()}-${String(dayDate.getMonth() + 1).padStart(2, '0')}-${String(dayDate.getDate()).padStart(2, '0')}`;
                weekDates.push(dateString);
                
                const dayDiv = document.querySelector(`.day[data-date="${dateString}"]`);
                if (dayDiv) {
                    dayDiv.classList.add('selected-week');
                }
            }
            
            clickedDay.classList.add('selected-day');
            renderWeeklyTasks(weekDates);
        }

        function showAnnualView() {
            weeklyTasksSection.style.display = 'none';
            annualView.style.display = 'block';
            document.querySelectorAll('.day.selected-week').forEach(d => d.classList.remove('selected-week'));
            document.querySelectorAll('.day.selected-day').forEach(d => d.classList.remove('selected-day'));
            renderYearGrid(currentYear);
        }
        
        function renderWeeklyTasks(weekDates) {
            weeklyTasksGrid.innerHTML = '';
            weeklyTasksHeader.textContent = `Tarefas da Semana de ${formatDateShort(weekDates[0])} a ${formatDateShort(weekDates[weekDates.length - 1])}`;
            
            weekDates.forEach(date => {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'weekly-day-card';
                if (isDayCompleted(date)) {
                    dayDiv.classList.add('completed');
                }
                
                dayDiv.innerHTML = `
                    <h3>
                        ${weekdayNames[new Date(date + 'T12:00:00').getDay()]} <br> ${formatDateShort(date)}
                        <button class="complete-btn" onclick="toggleDayCompletion('${date}')">
                            ${isDayCompleted(date) ? 'Desmarcar' : 'Concluir Dia'}
                        </button>
                    </h3>
                    <div class="daily-actions">
                        <button class="copy-btn" onclick="copyTasks('${date}')">Copiar</button>
                        <button class="paste-btn" onclick="pasteTasks('${date}')">Colar</button>
                    </div>
                    <div class="task-input-group">
                        <input type="time" class="task-start-time" placeholder="Início">
                        <input type="time" class="task-end-time" placeholder="Fim">
                        <input type="text" class="task-title" placeholder="Título da Tarefa">
                        <select class="task-color"></select>
                        <textarea class="task-description" rows="2" placeholder="Descrição"></textarea>
                        <button onclick="saveTask('${date}', this)">Adicionar</button>
                    </div>
                    <ul class="task-list" id="task-list-${date}"></ul>
                `;
                weeklyTasksGrid.appendChild(dayDiv);
                populateColorSelect(dayDiv.querySelector('.task-color'));
                renderTasks(date);
            });
        }

        async function toggleDayCompletion(date) {
            if (!tasks[date]) { tasks[date] = { tasks: [] }; }
            tasks[date].isCompleted = !isDayCompleted(date);
            await saveTasksToServer();
            
            const mainCalendarDay = document.querySelector(`.day[data-date="${date}"]`);
            if (mainCalendarDay) {
                mainCalendarDay.classList.toggle('completed');
            }
            
            const weeklyDayCard = document.querySelector(`.weekly-day-card h3 button[onclick*="${date}"]`).closest('.weekly-day-card');
            weeklyDayCard.classList.toggle('completed');
            
            const button = weeklyDayCard.querySelector('.complete-btn');
            button.textContent = isDayCompleted(date) ? 'Desmarcar' : 'Concluir Dia';
        }

        function renderTasks(date) {
            const taskList = document.getElementById(`task-list-${date}`);
            taskList.innerHTML = '';
            const dayTasks = tasks[date] && tasks[date].tasks || [];

            dayTasks.sort((a, b) => (a.startTime || '00:00').localeCompare(b.startTime || '00:00'));

            dayTasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = 'task-item';
                li.style.borderLeftColor = task.color;
                li.style.backgroundColor = task.color;
                li.style.color = getContrastColor(task.color);
                li.dataset.index = index;
                li.dataset.date = date;
                li.setAttribute('draggable', true);
                
                li.innerHTML = `
                    <div class="task-header">
                        <span class="drag-handle" draggable="true">⠿</span>
                        <div class="item-actions">
                            <button class="delete-btn" onclick="deleteTask('${date}', ${index})">X</button>
                            <button class="edit-btn" onclick="toggleEditMode(this)">Editar</button>
                            <button class="split-btn" onclick="splitTask('${date}', ${index})">+</button>
                        </div>
                    </div>
                    <div class="task-details">
                        <h4>${task.title}</h4>
                        <p>${task.startTime || ''} - ${task.endTime || ''}</p>
                        <p>${task.description || ''}</p>
                    </div>
                    <div class="edit-form">
                        <input type="time" value="${task.startTime || ''}" class="edit-start-time">
                        <input type="time" value="${task.endTime || ''}" class="edit-end-time">
                        <input type="text" value="${task.title}" class="edit-title">
                        <textarea rows="2" class="edit-description">${task.description || ''}</textarea>
                        <select class="edit-color"></select>
                        <button onclick="saveEdit('${date}', ${index}, this)">Salvar</button>
                    </div>
                `;
                taskList.appendChild(li);
                populateColorSelect(li.querySelector('.edit-color'));
                li.querySelector('.edit-color').value = task.color;
            });
            addDragAndDropListeners(taskList);
        }
        
        function addDragAndDropListeners(taskList) {
            taskList.addEventListener('dragstart', (e) => {
                const li = e.target.closest('.task-item');
                draggedItem = li;
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/html', li.innerHTML);
                setTimeout(() => li.classList.add('dragging'), 0);
            });

            taskList.addEventListener('dragover', (e) => {
                e.preventDefault();
                const li = e.target.closest('.task-item');
                if (li && li !== draggedItem) {
                    const rect = li.getBoundingClientRect();
                    const isNext = (e.clientY - rect.top) / rect.height > 0.5;
                    taskList.insertBefore(draggedItem, isNext && li.nextSibling || li);
                }
            });

            taskList.addEventListener('drop', async (e) => {
                e.preventDefault();
                draggedItem.classList.remove('dragging');
                const oldIndex = parseInt(draggedItem.dataset.index);
                const newIndex = Array.from(e.currentTarget.children).indexOf(draggedItem);
                const date = draggedItem.dataset.date;
                const taskListForDay = tasks[date].tasks;
                const [movedTask] = taskListForDay.splice(oldIndex, 1);
                taskListForDay.splice(newIndex, 0, movedTask);
                await saveTasksToServer();
                renderTasks(date);
                draggedItem = null;
            });
            
            taskList.addEventListener('dragend', () => {
                if (draggedItem) {
                    draggedItem.classList.remove('dragging');
                }
                draggedItem = null;
            });
        }

        function toggleEditMode(button) {
            const li = button.closest('.task-item');
            li.classList.toggle('edit-mode');
        }

        async function saveEdit(date, index, button) {
            const li = button.closest('.task-item');
            const newStartTime = li.querySelector('.edit-start-time').value;
            const newEndTime = li.querySelector('.edit-end-time').value;
            const newTitle = li.querySelector('.edit-title').value;
            const newDescription = li.querySelector('.edit-description').value;
            const newColor = li.querySelector('.edit-color').value;

            if (newTitle.trim() === '') {
                alert('O título da tarefa não pode estar vazio.');
                return;
            }

            tasks[date].tasks[index] = {
                startTime: newStartTime,
                endTime: newEndTime,
                title: newTitle,
                description: newDescription,
                color: newColor
            };
            await saveTasksToServer();
            renderTasks(date);
        }

        function copyTasks(date) {
            if (!tasks[date] || !tasks[date].tasks || tasks[date].tasks.length === 0) {
                clipboard = null;
                alert('Não há tarefas para copiar neste dia.');
                return;
            }
            clipboard = tasks[date].tasks.map(task => ({ ...task }));
            alert('Tarefas copiadas. Agora clique em "Colar" no dia de destino.');
        }

        async function pasteTasks(date) {
            if (!clipboard || clipboard.length === 0) {
                alert('Nenhuma tarefa para colar. Copie as tarefas de um dia primeiro.');
                return;
            }
            if (!tasks[date]) { tasks[date] = { tasks: [] }; }
            tasks[date].tasks = clipboard.map(task => ({ ...task }));
            await saveTasksToServer();
            renderYearGrid(currentYear);
            showWeeklyView(document.querySelector(`.day[data-date="${date}"]`));
            alert('Tarefas coladas com sucesso!');
        }
        
        async function splitTask(date, index) {
            if (!tasks[date] || !tasks[date].tasks || !tasks[date].tasks[index]) { return; }
            const originalTask = tasks[date].tasks[index];
            const newEndTime = prompt(`A tarefa "${originalTask.title}" vai até ${originalTask.endTime}. Em que horário você quer dividi-la? (Formato: HH:MM)`);
            
            if (!newEndTime || newEndTime.trim() === '') {
                return;
            }

            if (newEndTime <= originalTask.startTime || newEndTime >= originalTask.endTime) {
                alert('O novo horário deve estar entre o início e o fim da tarefa.');
                return;
            }

            const newTask = {
                startTime: newEndTime,
                endTime: originalTask.endTime,
                title: 'Nova Atividade',
                description: '',
                color: originalTask.color
            };

            originalTask.endTime = newEndTime;
            tasks[date].tasks.push(newTask);

            await saveTasksToServer();
            renderTasks(date);
        }
        
        async function saveTask(date, button) {
            const dayDiv = button.closest('.weekly-day-card');
            const startTime = dayDiv.querySelector('.task-start-time').value;
            const endTime = dayDiv.querySelector('.task-end-time').value;
            const title = dayDiv.querySelector('.task-title').value;
            const color = dayDiv.querySelector('.task-color').value;
            const description = dayDiv.querySelector('.task-description').value;
            
            if (title.trim() === '') return;
            const newTask = { startTime, endTime, title, color, description };
            
            if (!tasks[date] || !tasks[date].tasks) { 
                 tasks[date] = { tasks: [] }; 
            }
            
            tasks[date].tasks.push(newTask);
            await saveTasksToServer();
            renderTasks(date);
            const mainCalendarDay = document.querySelector(`.day[data-date="${date}"]`);
            if (mainCalendarDay) {
                mainCalendarDay.classList.add('has-tasks');
            }
            dayDiv.querySelector('.task-start-time').value = '';
            dayDiv.querySelector('.task-end-time').value = '';
            dayDiv.querySelector('.task-title').value = '';
            dayDiv.querySelector('.task-color').value = '#1E90FF';
            dayDiv.querySelector('.task-description').value = '';
        }

        async function deleteTask(date, index) {
            if (!tasks[date] || !tasks[date].tasks) return;
            
            tasks[date].tasks.splice(index, 1);
            if (tasks[date].tasks.length === 0) {
                delete tasks[date];
                const mainCalendarDay = document.querySelector(`.day[data-date="${date}"]`);
                if (mainCalendarDay) {
                    mainCalendarDay.classList.remove('has-tasks');
                    mainCalendarDay.classList.remove('completed');
                }
            }
            await saveTasksToServer();
            renderTasks(date);
        }

        function changeYear(offset) {
            renderYearGrid(currentYear + offset);
        }

        // Inicialização da aplicação
        window.onload = async () => {
            // Mostra loading
            yearGrid.innerHTML = '<div class="loading">Carregando tarefas...</div>';
            
            // Carrega tarefas do servidor
            await loadTasksFromServer();
            
            // Renderiza o calendário
            renderYearGrid(new Date().getFullYear());
        };

    </script>

</body>
</html>
